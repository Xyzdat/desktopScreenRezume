name: build and deploy

on: 
    push:
        branches:
            - main

jobs:
    build:
        name: Build project
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm

            - name: Install dependencies
              run: npm install

            - name: Build
              run: npm run build
            
            - name: Deploy
              env:
                VPS_HOST: ${{ secrets.VPS_HOST }}
                VPS_USER: ${{ secrets.VPS_USER }}
                VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
              run: |
                set -eu

                test -n "$VPS_SSH_KEY" || {
                echo "VPS_SSH_KEY is empty"
                exit 1
                }

                mkdir -p "$HOME/.ssh"
                printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
                chmod 600 "$HOME/.ssh/deploy_key"

                echo "Checking whether the private key can be parsed..."
                ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

                rsync -avz --delete \
                -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
                dist/ \
                "$VPS_USER@$VPS_HOST:/var/www/desktopScreenRezume/"